[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-cost-preview"
version = "0.1.0"
description = "Estimate monthly AWS cost from a Terraform plan."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chwaee", email = "hello@appliedaiconsulting.io" }]
keywords = ["terraform", "aws", "cost", "finops"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/chwaee/tf-cost-preview"

[project.scripts]
tf-cost = "tf_cost.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["tf_cost*"]

[tool.setuptools.package-data]
tf_cost = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tf_cost", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
